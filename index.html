<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#45536d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cancionero">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Cancionero Meribá</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Índice de canciones">
    <div class="brand">
      <h1>Cancionero Meribá</h1>
      <p>Edición 13 de junio de 2026 · <span id="total"></span> canciones</p>
    </div>
    <div class="install" id="install" hidden></div>
    <label class="sr" for="q" hidden>Buscar</label>
    <input id="q" class="search" type="search" placeholder="Buscar canción por título" autocomplete="off">
    <div class="chips" id="chips" role="group" aria-label="Categorías"></div>
    <p class="count" id="count"></p>
    <ul class="list" id="list"></ul>
  </aside>
  <main class="main" id="main"></main>
</div>
<script src="js/songs.js"></script>
<script src="js/app.js"></script>
</body>
</html>
